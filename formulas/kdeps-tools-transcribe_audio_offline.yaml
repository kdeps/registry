description: 'Transcribe an audio file to text offline with whisper.cpp (whisper-cli): no API key, no network. Supports flac, mp3, ogg, wav. Uses the GGML model at modelPath, or ggml-base.en.bin in the kdeps models dir (the transcribe component downloads it on first use). Returns the transcribed text.'
