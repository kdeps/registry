description: The `searchWeb` executor queries the web and returns structured results. The default provider is DuckDuckGo - no connection or API key required. Paid providers (Brave, Bing, Tavily) require a named connection in `workflow.yaml` settings. See [Search resources](https://kdeps.com/workflow/resources/search) for how it relates to `searchLocal`.
