description: 'Slack events over Socket Mode (no public URL): runs the workflow once for each message event. The event is the Slack event: input(''text''), input(''channel''), input(''user''). Messages from bots are left out. Reply with the slack_post component (chat.postMessage). Needs SLACK_APP_TOKEN (xapp-) for the connection.'
