description: 'The `embedding` component runs one embedding operation and returns a structured result: a SQLite keyword store for `index`, `search`, `upsert` and `delete`; an embedding backend for `vectorize` and `embed_query`; Cohere for `rerank`. It comes from the `components` asset set; call it with a `component:` resource, no install step. It calls the kdeps API''s `embedding` tool, which runs the native executor. A workflow using `embedding:` directly, as primary or in a `before:`/`after:` step, is rejected.'
