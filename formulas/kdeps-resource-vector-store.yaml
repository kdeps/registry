description: The `vectorStore:` resource adds documents to, and runs similarity search against, an external vector database. Unlike the `embedding` component (SQLite keyword index built into kdeps), `vectorStore:` talks to a real vector database service - Qdrant, Chroma, Pinecone, pgvector, and more - for production-scale RAG.
