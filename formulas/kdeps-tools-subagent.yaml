description: 'Hand a task to a subagent, a fresh agent that has not seen this conversation. It reads files and searches with read-only tools, then returns a report. Use it for a second opinion with no shared assumptions, such as reviewing a design or a change. State everything it needs in task, and name every file it must read by absolute path: it does not know this skill''s or project''s folders. Several subagent calls in one reply run in parallel.'
